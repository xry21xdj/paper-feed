# NeurIPS, ICML and ICLR publish their full accepted-paper lists on the conference websites (titles
# and authors, no abstracts); abstracts are looked up on OpenAlex, usually from the arXiv version.
paper_lists:
  - {name: NeurIPS, url: "https://neurips.cc/static/virtual/data/neurips-{year}-orals-posters.json"}
  - {name: ICML, url: "https://icml.cc/static/virtual/data/icml-{year}-orals-posters.json"}
  - {name: ICLR, url: "https://iclr.cc/static/virtual/data/iclr-{year}-orals-posters.json"}

# Other conferences: fetched from OpenAlex by source ID (https://api.openalex.org/sources?search=<name>).
conferences:
  # AI / ML
  - {name: NeurIPS, openalex: S4363606243}
  - {name: AAAI, openalex: S4210191458}
  - {name: IJCAI, openalex: S4306419999}
