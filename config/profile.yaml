# Paper feed configuration. This is the only file you normally need to edit.

site:
  title: "E-Bus & Transport Research Feed"
  subtitle: "Daily papers on electric-bus operations, traffic simulation, agentic AI, AI for optimisation and grid integration"
  author: "Renyou Xie, UNSW"
  base_url: "https://xry21xdj.github.io/paper-feed/"   # used in feed.xml links

# Used as the scoring rubric for Claude. Write it as you'd describe your work to a colleague.
profile: |
  Postdoc at UNSW working on electric-bus fleet operations. Core interests:
  - Electric vehicle / electric bus scheduling (E-VSP, MDEVSP), charging scheduling, partial charging,
    capacitated chargers, time-of-use tariffs, battery ageing as a cost; robust, stochastic and
    chance-constrained optimisation; column generation, branch-and-price, MILP decomposition,
    learning-augmented exact methods.
  - Microscopic traffic simulation (SUMO) of bus lines built from public data (GTFS, OSM, AVL/APC,
    stop arrivals); calibration of simulation parameters with Bayesian optimisation, Gaussian-process
    surrogates, identifiability analysis; validation on blind hold-out data; energy consumption of buses.
  - LLM agents for transport and operations research: agents that run simulation/optimisation pipelines,
    LLM + optimisation, multi-agent LLM decision making for transit disruptions and emergencies.
  - Agentic AI in general (top AI venues: NeurIPS, ICML, ICLR, AAAI, IJCAI, AAMAS): LLM agents that plan,
    use tools and write code, multi-agent LLM systems, agent workflows for scientific/engineering tasks,
    evaluation and reliability of agents. Relevant even without a transport application; most relevant
    when the agents plan, optimise, run simulations or make operational decisions.
  - AI for optimisation: learning to optimise, neural combinatorial optimisation (routing, scheduling),
    ML-guided MILP solving (learning to branch/cut, learned heuristics, warm starts), LLMs that formulate
    optimisation models or design heuristics/algorithms, RL for scheduling and dispatching.
  - Transport-grid integration: bus depot and opportunity charging impact on distribution networks,
    V2G, aggregators, charging flexibility, electricity price uncertainty (e.g. AEMO NEM).
  Less relevant: battery chemistry/materials, private-car consumer adoption surveys, autonomous-driving
  perception, freight-only logistics without electrification, generic deep learning or LLM papers
  (pre-training, fine-tuning, vision, chat benchmarks) that are neither agentic nor about optimisation.

topics:
  ebus:
    label: "E-bus scheduling & charging"
    keywords: [electric bus, e-bus, battery electric bus, electric vehicle scheduling, vehicle scheduling,
               charging schedul, charging station, opportunity charging, depot charging, partial charging,
               charging infrastructure, column generation, branch-and-price, branch and price,
               time-of-use, fleet electrification, electric fleet, transit fleet, battery degradation]
  sim:
    label: "Traffic simulation & calibration"
    keywords: [SUMO, microscopic simulation, microsimulation, traffic simulation, calibration,
               bayesian optimization, bayesian optimisation, surrogate model, gaussian process,
               GTFS, bus line, bus route, travel time, dwell time, transit simulation, digital twin]
  llm:
    label: "LLM & agentic AI"
    keywords: [large language model, LLM, language model, multi-agent, foundation model, GPT, generative AI]
    # Enough on their own: no transport/optimisation context needed.
    free_keywords: [agentic, AI agent, LLM agent, LLM-based agent, language agent, autonomous agent,
                    multi-agent LLM, agent workflow, agentic workflow, tool-augmented, tool use, tool-use]
    # Besides anchor_keywords below, these also count as context for this topic.
    anchors: [optimization problem, optimisation problem, combinatorial optimization,
              combinatorial optimisation, mathematical optimization, mathematical optimisation,
              operations research, MILP, mixed-integer, integer programming, linear programming,
              scheduling, routing, solver, heuristic, simulation, decision-making, decision making]
  ai4opt:
    label: "AI for optimisation"
    keywords: [combinatorial optimization, combinatorial optimisation, mixed-integer, MILP, integer programming,
               linear programming, routing problem, scheduling problem, optimization problem,
               optimisation problem, branch-and-bound, branch and bound, metaheuristic, heuristic design,
               solver, dispatching]
    free_keywords: [learning to optimize, learning to optimise, learning-to-optimize, L2O,
                    neural combinatorial optimization, neural combinatorial optimisation, learning to branch, learning to cut, learning-augmented,
                    neural solver, neural heuristic, optimization modeling, optimisation modelling,
                    optimization formulation, automated heuristic design, automatic heuristic design,
                    algorithm discovery, evolution of heuristics, AI for optimization, AI for optimisation,
                    machine learning for optimization, ML for optimization]
    anchors: [machine learning, deep learning, reinforcement learning, neural network, graph neural,
              GNN, transformer, LLM, large language model, language model, learning-based, learned,
              data-driven, generative, imitation learning]
  grid:
    label: "Transport-grid integration"
    keywords: [vehicle-to-grid, V2G, grid integration, distribution network, power grid, aggregator,
               demand response, charging load, electricity price, flexibility, smart charging,
               power system, renewable]

# A candidate must also mention at least one anchor term (transport / EV context), otherwise
# generic LLM, calibration or power-system papers would flood the feed. Exceptions: a topic's
# `free_keywords` need no context, its `anchors` count as context for that topic, and papers from
# journals/conferences marked `anchor: true` (transport venues) skip the check.
anchor_keywords: [bus, buses, transit, public transport, vehicle, EV, EVs, electric vehicle, charging,
                  charger, traffic, mobility, fleet, transportation, transport network, road network,
                  ride-hailing, vehicle routing]

arxiv:
  categories: [math.OC, eess.SY, cs.AI, cs.MA, cs.LG, cs.CE, cs.NE, physics.soc-ph]
  max_results: 1000

