name: Daily paper feed

on:
  schedule:
    - cron: "0 20 * * *"   # 07:00 Sydney in summer (AEDT), 06:00 in winter (AEST)
  workflow_dispatch:
    inputs:
      days:
        description: "Fetch window in days (blank = config default)"
        required: false

permissions:
  contents: write

concurrency:
  group: paper-feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch, score and build
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          CROSSREF_MAILTO: ${{ vars.CROSSREF_MAILTO }}
        run: python -m feed.main ${{ inputs.days && format('--days {0}', inputs.days) || '' }}

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "Daily feed $(TZ=Australia/Sydney date +%F)"
          git push
